<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>哲学者アリーナ — 入門</title>
<style>
  body {
    margin: 0;
    font-family: "游明朝", "Yu Mincho", "Hiragino Mincho Pro", serif;
    background: radial-gradient(circle at center, #2a251d 0%, #1a1610 100%);
    color: #e8e1cc;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box {
    text-align: center;
    padding: 40px;
    max-width: 440px;
    background: rgba(243, 234, 212, 0.04);
    border: 1px solid rgba(167, 125, 60, 0.4);
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(167, 125, 60, 0.1);
  }
  .pillar {
    font-size: 48px;
    color: #a77d3c;
    letter-spacing: 10px;
    margin-bottom: 4px;
  }
  h1 {
    font-size: 26px;
    letter-spacing: 6px;
    margin: 10px 0 6px;
    font-weight: normal;
  }
  .sub {
    color: #a77d3c;
    font-style: italic;
    font-size: 13px;
    margin-bottom: 30px;
    letter-spacing: 2px;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  label {
    color: #bfad80;
    font-size: 14px;
    letter-spacing: 2px;
  }
  input[type="text"] {
    padding: 12px 16px;
    font-size: 16px;
    text-align: center;
    border: 1px solid rgba(167, 125, 60, 0.5);
    background: rgba(255, 251, 238, 0.05);
    color: #e8e1cc;
    border-radius: 4px;
    font-family: inherit;
    letter-spacing: 4px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #a77d3c;
    background: rgba(255, 251, 238, 0.08);
  }
  button {
    padding: 12px;
    background: linear-gradient(180deg, #a77d3c 0%, #8b5a2b 100%);
    color: #fcf6e4;
    border: none;
    border-radius: 4px;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 6px;
    cursor: pointer;
  }
  button:hover {
    background: linear-gradient(180deg, #b88d44 0%, #9b6a33 100%);
  }
  .error {
    color: #d97070;
    font-size: 13px;
    margin-top: -6px;
    font-style: italic;
  }
  .note {
    margin-top: 24px;
    color: #8b8368;
    font-size: 11px;
    font-style: italic;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="pillar">⚯</div>
    <h1>哲学者アリーナ</h1>
    <div class="sub">— 古の賢者と問答せよ —</div>

    <form method="post">
      <label for="pw">合言葉を入力してください</label>
      <input id="pw" name="passphrase" type="text" autofocus autocomplete="off" placeholder="••••">
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <button type="submit">入門する</button>
    </form>

    <div class="note">※ 招待を受けた方のみご入門いただけます</div>
  </div>
</body>
</html>
